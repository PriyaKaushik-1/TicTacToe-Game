<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-animation"></div>

    <main class="app-container glass-panel">
        <header>
            <h1>Tic-Tac-Toe</h1>
            <div class="header-controls">
                <button id="settings-btn" class="icon-btn" aria-label="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </header>

        <section class="game-setup">
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="pvc">1 Player (vs AI)</button>
                <button class="mode-btn" data-mode="pvp">2 Players</button>
            </div>
            
            <div class="difficulty-selector" id="difficulty-wrapper">
                <span>AI Difficulty:</span>
                <select id="difficulty-select" class="dropdown">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard" selected>Hard (Unbeatable)</option>
                </select>
            </div>
        </section>

        <section class="scoreboard">
            <div class="score-card player-x active-turn">
                <div class="score-name">Player X</div>
                <div class="score-value" id="score-x">0</div>
            </div>
            <div class="score-card ties">
                <div class="score-name">Ties</div>
                <div class="score-value" id="score-ties">0</div>
            </div>
            <div class="score-card player-o">
                <div class="score-name">Player O</div>
                <div class="score-value" id="score-o">0</div>
            </div>
        </section>

        <section class="game-board-wrapper">
            <div class="game-board" id="board">
                <!-- Cells generated by JS -->
            </div>
            <div class="win-line" id="win-line"></div>
        </section>

        <div class="game-controls">
            <button id="reset-game-btn" class="primary-btn">Restart Game</button>
        </div>
    </main>

    <!-- Modals -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-modal-btn icon-btn" aria-label="Close Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>Theme</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="theme-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-group">
                    <label>Sound Effects</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-group">
                    <label>Sound Theme</label>
                    <select id="sound-theme" class="dropdown">
                        <option value="modern">Modern UI</option>
                        <option value="retro">8-Bit Retro</option>
                        <option value="acoustic">Acoustic</option>
                    </select>
                </div>
                <div class="setting-group color-pickers">
                    <div class="color-picker">
                        <label for="color-x">Player X Color</label>
                        <input type="color" id="color-x" value="#ff4b4b">
                    </div>
                    <div class="color-picker">
                        <label for="color-o">Player O Color</label>
                        <input type="color" id="color-o" value="#4b8eff">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="modal hidden">
        <div class="modal-content glass-panel text-center">
            <h2 id="game-over-message" class="game-over-title">Player X Wins!</h2>
            <button id="play-again-btn" class="primary-btn mt-4">Play Again</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
